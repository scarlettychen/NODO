plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group = 'com.nodo'
version = '1.0.0-beta.1'

android {
    namespace 'com.nonodo'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 33
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        // Never embed third-party JARs into the AAR/classes.jar.
        resources {
            excludes += [
                    'META-INF/*.SF',
                    'META-INF/*.DSA',
                    'META-INF/*.RSA'
            ]
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // THIN LIBRARY: FTC SDK is compile-time only. Do NOT use implementation/api/runtimeOnly
    // for RobotCore / Hardware — that would fat-jar the SDK into the AAR teams download.
    // Teams already have the FTC SDK on their Robot Controller classpath.
    compileOnly 'org.firstinspires.ftc:RobotCore:9.0.1'
    compileOnly 'org.firstinspires.ftc:Hardware:9.0.1'
}

// OnBot Java / Blocks: thin JAR only (NODO classes). Upload build/outputs/jar/nodo-*.jar
def releaseAar = layout.buildDirectory.file("outputs/aar/${rootProject.name}-release.aar")
def thinJarOut = layout.buildDirectory.dir('outputs/jar')

tasks.register('exportReleaseJar', Copy) {
    description = 'Extract thin classes.jar from the release AAR (no FTC SDK bundled).'
    group = 'build'
    dependsOn 'assembleRelease'
    from(zipTree(releaseAar)) {
        include 'classes.jar'
    }
    into thinJarOut
    rename('classes.jar', "${rootProject.name}-${version}.jar")
}

tasks.register('verifyThinJar') {
    description = 'Fail if the exported JAR contains FTC/Qualcomm SDK classes (must stay thin).'
    group = 'verification'
    dependsOn 'exportReleaseJar'

    doLast {
        def jarFile = thinJarOut.get().asFile.toPath().resolve("${rootProject.name}-${version}.jar").toFile()
        if (!jarFile.exists()) {
            throw new GradleException("Missing thin JAR: ${jarFile}")
        }

        def forbiddenPrefixes = [
                'org/firstinspires/',
                'com/qualcomm/',
                'android/',
                'androidx/',
                'com/google/',
                'kotlin/',
                'okhttp',
                'okio/'
        ]
        def leaked = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                def name = entry.name
                if (name.endsWith('.class') && forbiddenPrefixes.any { name.startsWith(it) }) {
                    leaked << name
                }
            }
        }

        if (!leaked.isEmpty()) {
            throw new GradleException(
                    "FAT JAR DETECTED: SDK classes found in ${jarFile.name}. " +
                    "Keep FTC deps as compileOnly only.\n" +
                    leaked.take(20).join('\n')
            )
        }

        logger.lifecycle("Thin JAR OK: ${jarFile.name} (${jarFile.length()} bytes) — only com.nonodo classes")
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = rootProject.name
                version = project.version

                // POM must not declare FTC as a transitive dependency.
                pom.withXml {
                    def depsNode = asNode().dependencies
                    if (depsNode != null) {
                        depsNode.dependency.findAll { node ->
                            def g = node.groupId.text()
                            g == 'org.firstinspires.ftc' || g.startsWith('com.qualcomm')
                        }.each { it.parent().remove(it) }
                    }
                }
            }
        }
    }

    tasks.named('assembleRelease').configure {
        finalizedBy 'exportReleaseJar'
    }

    tasks.named('exportReleaseJar').configure {
        finalizedBy 'verifyThinJar'
    }

    tasks.named('check').configure {
        dependsOn 'verifyThinJar'
    }
}
