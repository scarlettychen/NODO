plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group = 'com.nodo'
version = '1.0.0'

android {
    namespace 'com.nonodo'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 33
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // Provided by the team's FtcRobotController / TeamCode app — not bundled in the AAR.
    compileOnly 'org.firstinspires.ftc:RobotCore:9.0.1'
    compileOnly 'org.firstinspires.ftc:Hardware:9.0.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = rootProject.name
                version = project.version
            }
        }
    }
}

// OnBot Java / Blocks: upload build/outputs/jar/nodo-1.0.0.jar
tasks.register('exportReleaseJar', Copy) {
    dependsOn 'assembleRelease'
    from(zipTree(layout.buildDirectory.file("outputs/aar/${rootProject.name}-release.aar").get().asFile)) {
        include 'classes.jar'
    }
    into layout.buildDirectory.dir('outputs/jar')
    rename('classes.jar', "${rootProject.name}-${version}.jar")
}
