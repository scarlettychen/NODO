<style>
  .language-toggle > [data-language]:not(:first-of-type) { display: none; }
  html.nodo-lang-ready .language-toggle > [data-language]:not(.is-lang-active) {
    display: none !important;
    visibility: hidden !important;
    height: 0 !important;

    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
  }
  html.nodo-lang-ready .language-toggle > [data-language].is-lang-active {

  }
