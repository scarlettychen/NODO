<style>
  .language-toggle > [data-language]:not(:first-of-type) { display: none; }
  html.nodo-lang-ready .language-toggle > [data-language]:not(.is-lang-active) {
    display: none !important;
    visibility: hidden !important;
    height: 0 !important;
    overflow: hidden !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
  }
  html.nodo-lang-ready .language-toggle > [data-language].is-lang-active {
    display: block !important;
    visibility: visible !important;
    height: auto !important;
    overflow: visible !important;
  }
</style>
<script>
  // Apply saved language before paint so every section matches on first load.
  (function () {
    try {
      var key = 'nodo-docs-lang';
      var stored = window.localStorage.getItem(key);
      if (stored === 'java' || stored === 'blocks') {
        document.documentElement.setAttribute('data-nodo-lang', stored);
      } else {
        document.documentElement.setAttribute('data-nodo-lang', 'java');
      }
    } catch (e) {
      document.documentElement.setAttribute('data-nodo-lang', 'java');
    }
  })();
</script>
<script src="{{ '/assets/js/language-toggle.js' | relative_url }}" defer></script>
